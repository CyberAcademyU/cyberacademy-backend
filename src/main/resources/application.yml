server:
  port: 8080
  # Detrás de Render/Cloudflare la IP del cliente llega en X-Forwarded-For.
  # Sin esto, getRemoteAddr() devuelve la IP del proxy y RateLimitService aplica
  # un único límite global de 50 intentos/15 min a todos los usuarios a la vez.
  forward-headers-strategy: framework
  servlet:
    context-path: /api/v1 # Todas las rutas iniciarán con /api/v1

spring:
  application:
    name: cyberacademy-backend

  # Si no se activa ningún perfil, se usa "local" (credenciales de desarrollo).
  # En producción ejecutar con: SPRING_PROFILES_ACTIVE=prod y definir las variables de entorno.
  profiles:
    default: local

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Requisito del proyecto: no modificar la BD automáticamente
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

  # Servidor SMTP para el envío de códigos OTP
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Timeouts para no dejar la petición HTTP colgada si el SMTP no responde
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Seguridad y Tokens JWT
security:
  jwt:
    # Obligatoria: se define en application-local.yml (dev) o en la variable JWT_SECRET (prod)
    secret: ${JWT_SECRET}
    issuer: https://cyberacademy.api
    expiration-minutes: 60
  cors:
    # Lista separada por comas. Ej: http://localhost:4200,https://app.cyberacademy.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  mail:
    transport: ${MAIL_TRANSPORT:smtp}
    gmail:
      client-id: ${GMAIL_CLIENT_ID:}
      client-secret: ${GMAIL_CLIENT_SECRET:}
      refresh-token: ${GMAIL_REFRESH_TOKEN:}
    # Remitente que verá el estudiante. Ej: CyberAcademy <tu.correo@gmail.com>
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@cyberacademy.local}}

# Zona horaria de rachas, calendario de actividad y semana de la clasificación
app:
  time-zone: ${APP_TIME_ZONE:America/Panama}

# Exportación de métricas desactivada hasta configurar Grafana Cloud.
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        exclude: "*"
  metrics:
    tags:
      application: cyberacademy-backend
  otlp:
    metrics:
      export:
        enabled: ${GRAFANA_METRICS_ENABLED:false}
        url: ${GRAFANA_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 60s
        headers:
          Authorization: ${GRAFANA_OTLP_AUTHORIZATION:}
        resource-attributes:
          service.name: cyberacademy-backend
