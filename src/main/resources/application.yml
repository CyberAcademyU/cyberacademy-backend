server:
  port: 8080
  # Detrás de Render/Cloudflare la IP del cliente llega en X-Forwarded-For.
  # Sin esto, getRemoteAddr() devuelve la IP del proxy y RateLimitService aplica
  # un único límite global de 50 intentos/15 min a todos los usuarios a la vez.
  forward-headers-strategy: framework
  # En un deploy, Render envía SIGTERM: esperamos a que terminen las peticiones en vuelo
  # en lugar de cortarlas (ver spring.lifecycle.timeout-per-shutdown-phase).
  shutdown: graceful
  compression:
    enabled: true
    # SSE (text/event-stream) queda fuera a propósito: comprimir un stream no aporta nada
    # y el buffering del compresor retrasaría los heartbeats.
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    # Respuestas pequeñas no compensan el coste de CPU de comprimir.
    min-response-size: 2048
  servlet:
    context-path: /api/v1 # Todas las rutas iniciarán con /api/v1

spring:
  application:
    name: cyberacademy-backend

  lifecycle:
    # Tope de espera del graceful shutdown. Los SSE se cierran antes (ContextClosedEvent),
    # así que en la práctica el apagado es inmediato.
    timeout-per-shutdown-phase: 20s

  # Si no se activa ningún perfil, se usa "local" (credenciales de desarrollo).
  # En producción ejecutar con: SPRING_PROFILES_ACTIVE=prod y definir las variables de entorno.
  profiles:
    default: local

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Requisito del proyecto: no modificar la BD automáticamente
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

  # Servidor SMTP para el envío de códigos OTP
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Timeouts para no dejar la petición HTTP colgada si el SMTP no responde
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Seguridad y Tokens JWT
security:
  jwt:
    # Obligatoria: se define en application-local.yml (dev) o en la variable JWT_SECRET (prod)
    secret: ${JWT_SECRET}
    issuer: https://cyberacademy.api
    expiration-minutes: 60
  cors:
    # Lista separada por comas. Ej: http://localhost:4200,https://app.cyberacademy.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  mail:
    transport: ${MAIL_TRANSPORT:smtp}
    resend:
      api-key: ${RESEND_API_KEY:}
    gmail:
      client-id: ${GMAIL_CLIENT_ID:}
      client-secret: ${GMAIL_CLIENT_SECRET:}
      refresh-token: ${GMAIL_REFRESH_TOKEN:}
    # Remitente que verá el estudiante. Ej: CyberAcademy <tu.correo@gmail.com>
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@cyberacademy.local}}

# Zona horaria de rachas, calendario de actividad y semana de la clasificación
app:
  time-zone: ${APP_TIME_ZONE:America/Panama}

# Exportación de métricas desactivada hasta configurar Grafana Cloud.
management:
  endpoints:
    # Ningún endpoint de actuator se expone salvo los listados abajo.
    enabled-by-default: false
    web:
      exposure:
        # Solo health: permite que Render detecte una instancia colgada.
        # metrics y el resto siguen en 404.
        include: health
  endpoint:
    health:
      enabled: true
      # Sin detalles: público pero sin filtrar componentes, versiones ni estado de la BD.
      show-details: never
  health:
    db:
      # Render reinicia la instancia tras 60 s de health checks fallidos y exige respuesta
      # en 5 s. Si Supabase no responde, la comprobación de BD tarda hasta 20 s (timeout de
      # Hikari) y provocaría un bucle de reinicios de una JVM que tarda ~50 s en arrancar.
      # El health check queda como prueba de que el proceso HTTP sigue vivo; la BD se
      # comprueba en cada petición real, no aquí.
      enabled: false
    mail:
      # El indicador de correo abre una conexión SMTP real en cada comprobación (5 s de
      # timeout con Gmail y riesgo de throttling). El health check debe ser local y rápido.
      enabled: false
  metrics:
    tags:
      application: cyberacademy-backend
  otlp:
    metrics:
      export:
        enabled: ${GRAFANA_METRICS_ENABLED:false}
        url: ${GRAFANA_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 60s
        headers:
          Authorization: ${GRAFANA_OTLP_AUTHORIZATION:}
        resource-attributes:
          service.name: cyberacademy-backend
