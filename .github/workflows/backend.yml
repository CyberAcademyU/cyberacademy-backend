name: Backend CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: build-backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: messaging_test
          # Base efímera y aislada del runner; no utiliza credenciales de producción.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d messaging_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MESSAGING_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/messaging_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y empaquetar
        run: mvn -B -ntp verify
